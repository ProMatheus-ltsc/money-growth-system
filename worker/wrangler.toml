# fam-asset-backup-worker — 独立备份 Worker（04 §7.1）
# 每日 01:00（北京时间，UTC 17:00）全量导出 D1 → R2，保留最近 30 份。
# 与主项目绑定同一 D1/R2；S10 建库后回填真实 database_id。
name = "fam-asset-backup-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[triggers]
crons = ["0 17 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fam-asset-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "BACKUP"
bucket_name = "fam-asset-backups"
